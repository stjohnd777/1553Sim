<svg font-family="-apple-system-body, ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Helvetica, &quot;Apple Color Emoji&quot;, Arial, sans-serif, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;" font-weight="400" data-d-component="svg" fill="currentColor" style="color:rgb(237, 237, 237)" viewBox="0 0 340 88" width="100%" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="12" width="88" height="36" rx="3" fill="#2563eb"/><text x="44" y="33" fill="white" font-size="11" text-anchor="middle">RT address</text><text x="44" y="65" fill="currentColor" font-size="10" text-anchor="middle">5 bits</text><rect x="92" y="12" width="38" height="36" rx="3" fill="#7c3aed"/><text x="111" y="33" fill="white" font-size="10" text-anchor="middle">T/R</text><text x="111" y="65" fill="currentColor" font-size="10" text-anchor="middle">1 bit</text><rect x="134" y="12" width="115" height="36" rx="3" fill="#0f766e"/><text x="191.5" y="33" fill="white" font-size="11" text-anchor="middle">Subaddress</text><text x="191.5" y="65" fill="currentColor" font-size="10" text-anchor="middle">5 bits</text><rect x="253" y="12" width="85" height="36" rx="3" fill="#9a6700"/><text x="295.5" y="33" fill="white" font-size="11" text-anchor="middle">Word count</text><text x="295.5" y="65" fill="currentColor" font-size="10" text-anchor="middle">5 bits</text><text x="170" y="82" text-anchor="middle" font-size="10" fill="currentColor">16-bit command payload, excluding sync and parity</text></svg>